<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:14px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .specrow{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:7px 0;border-bottom:1px solid var(--nv-rule-soft);}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Type scale — fluid, rem, clamp for headlines</div>
  <div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Masthead</span><span class="meta">clamp(2.4–3rem)</span><span class="meta" style="min-width:120px;text-align:right">Serif 500</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Headline</span><span class="meta">clamp(1.7–2.1rem)</span><span class="meta" style="min-width:120px;text-align:right">Serif 500</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Subhead h2</span><span class="meta">1.25–1.45rem</span><span class="meta" style="min-width:120px;text-align:right">Serif 600</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Dek</span><span class="meta">1rem</span><span class="meta" style="min-width:120px;text-align:right">Serif italic 400</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Body</span><span class="meta">1.06rem</span><span class="meta" style="min-width:120px;text-align:right">Serif 400</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Pull quote</span><span class="meta">1.2rem</span><span class="meta" style="min-width:120px;text-align:right">Serif 500</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Kicker</span><span class="meta">0.7rem</span><span class="meta" style="min-width:120px;text-align:right">Sans 500</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Score</span><span class="meta">1.5rem</span><span class="meta" style="min-width:120px;text-align:right">Mono 500</span></div><div class="specrow"><span style="font-family:var(--nv-serif);color:var(--nv-press-navy)">Disclaimer</span><span class="meta">0.66rem</span><span class="meta" style="min-width:120px;text-align:right">Sans italic 400</span></div></div></body></html>
