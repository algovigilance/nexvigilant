<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Label sans</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:14px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .specrow{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:7px 0;border-bottom:1px solid var(--nv-rule-soft);}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Label sans — Inter · apparatus</div>
  <div style="display:flex;flex-direction:column;gap:13px">
    <div style="font-family:var(--nv-sans);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-accent-red)">Drug Development · Satire</div>
    <div style="font-family:var(--nv-sans);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--nv-sepia)">More from the desk</div>
    <div style="font-family:var(--nv-sans);font-size:12px;color:var(--nv-sepia)"><span style="color:var(--nv-ink);font-weight:600">By Margaret A. Voss</span>, Special to The Serial Vigilant · Pipeline Correspondent</div>
    <div><span style="font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;color:#FBF8F1;background:var(--nv-accent-red);padding:5px 9px;border-radius:1px">SATIRE</span></div>
  </div>
  <div class="meta" style="margin-top:16px">Kicker .7rem/.16em · Label .72rem/.12em · Byline .75rem · Badge 700</div></div></body></html>
