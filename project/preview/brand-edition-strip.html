<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Edition strip</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Edition strip — self-labels before the lede</div>
  <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--nv-rule);font-family:var(--nv-sans);font-size:11px;color:var(--nv-sepia);letter-spacing:.04em">
    <span style="font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;color:#FBF8F1;background:#1E3A5F;padding:5px 10px;border-radius:1px">ANALYSIS</span>
    <span>Vol.&nbsp;III</span><span style="color:var(--nv-rule)">·</span><span>No.&nbsp;0096</span><span style="color:var(--nv-rule)">·</span><span>Est.&nbsp;2026</span><span style="color:var(--nv-rule)">·</span><span>Evidence-weighted</span>
    <span style="flex:1"></span>
    <span style="font-family:var(--nv-mono);font-size:11px">NV-SIG-0096</span>
  </div>
  <div class="meta" style="margin-top:14px">Badge · Vol · No · Est · price-flavor · issue ID (mono)</div></div></body></html>
