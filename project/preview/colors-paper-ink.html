<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Paper & Ink</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;}
  .swatch{flex:1;min-width:0;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(28,24,18,.12);}
  .sw-meta{font-family:var(--nv-sans);font-size:11px;line-height:1.45;margin-top:8px;}
  .sw-name{font-weight:600;color:var(--nv-ink);letter-spacing:.02em;}
  .sw-hex{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;}
  .sw-role{color:var(--nv-sepia);}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);}
  
</style></head><body class="nv"><div class="card"><div class="lbl" style="margin-bottom:16px">Paper &amp; Ink — core surface and text</div>
  <div class="row">
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#FBF8F1;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:var(--nv-ink);text-transform:uppercase">#FBF8F1</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Newsprint</div><div class="sw-role">Page background</div></div>
  </div>
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#101C34;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:#FBF8F1;text-transform:uppercase">#101C34</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Press Navy</div><div class="sw-role">Masthead · headlines</div></div>
  </div>
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#1C1812;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:#FBF8F1;text-transform:uppercase">#1C1812</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Ink</div><div class="sw-role">Body text</div></div>
  </div>
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#6B5D45;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:#FBF8F1;text-transform:uppercase">#6B5D45</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Sepia Gray</div><div class="sw-role">Captions · byline</div></div>
  </div>
  </div></div></body></html>
