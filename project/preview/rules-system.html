<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Rule system</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Hairlines &amp; dividers — the structural ink</div>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div><div style="height:1px;background:var(--nv-rule)"></div><div class="meta" style="margin-top:6px">Hairline 1px · Rule #D8CDB6 — column & section dividers</div></div>
    <div><div style="height:3px;background:var(--nv-accent-red)"></div><div class="meta" style="margin-top:6px">Heavy 3px accent — kicker / pull-quote rule</div></div>
    <div><div style="height:3px;background:var(--nv-accent-red)"></div><div style="height:1px;background:var(--nv-rule);margin-top:3px"></div><div class="meta" style="margin-top:6px">Compound rule — accent over hairline (masthead → article)</div></div>
    <div><div style="height:3px;border-top:3px double var(--nv-rule)"></div><div class="meta" style="margin-top:6px">Double rule — footer cap</div></div>
  </div></div></body></html>
