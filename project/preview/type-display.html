<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Display serif</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:14px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .specrow{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:7px 0;border-bottom:1px solid var(--nv-rule-soft);}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Editorial serif — Newsreader · display roles</div>
  <div style="font-family:var(--nv-serif);font-weight:500;font-size:42px;line-height:1;color:var(--nv-press-navy);letter-spacing:.01em">The Serial <em style="font-style:italic;color:var(--nv-accent-red)">Vigilant</em></div>
  <div style="font-family:var(--nv-serif);font-weight:500;font-size:30px;line-height:1.12;color:var(--nv-press-navy);margin-top:14px;max-width:560px">Pharma giant announces breakthrough drug</div>
  <div style="font-family:var(--nv-serif);font-weight:600;font-size:21px;color:var(--nv-press-navy);margin-top:12px">A continuum of care, and of billing</div>
  <div class="meta" style="margin-top:14px">Masthead 500 · Headline 500 · Subhead h2 600</div></div></body></html>
