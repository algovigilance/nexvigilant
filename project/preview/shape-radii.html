<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Corners & shape</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Corners — near-square, print-true</div>
  <div style="display:flex;gap:22px;align-items:center">
    <div style="text-align:center"><div style="width:80px;height:54px;background:#fff;border:1px solid var(--nv-rule);border-radius:1px"></div><div class="meta" style="margin-top:8px">1px · panels</div></div>
    <div style="text-align:center"><div style="width:80px;height:54px;background:var(--nv-press-navy);border-radius:1px"></div><div class="meta" style="margin-top:8px">1px · badge</div></div>
    <div style="text-align:center"><div style="width:54px;height:54px;background:var(--nv-newsprint-deep);border:1px solid var(--nv-rule);border-radius:50%"></div><div class="meta" style="margin-top:8px">50% · hedcut only</div></div>
  </div>
  <div class="meta" style="margin-top:16px">No drop shadows · no glow · flat fills · circle reserved for the author mark</div></div></body></html>
