<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Evidentiary pull quote</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .badge{display:inline-flex;font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FBF8F1;padding:6px 11px;border-radius:1px;line-height:1}
  .tag{font-family:var(--nv-sans);font-size:11px;font-weight:600;color:var(--nv-ink);padding:4px 9px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--nv-rule);background:var(--nv-newsprint)}
</style></head><body class="nv"><div class="card"><div class="lbl">Pull quote (b) — evidentiary, the unit of scrutiny</div>
  <figure style="margin:0;padding:20px;background:#fff;border:1px solid var(--nv-rule);border-left:3px solid var(--nv-signal-blue)">
    <div style="font-family:var(--nv-sans);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--nv-signal-blue);margin-bottom:12px">Claim under review</div>
    <blockquote style="margin:0 0 10px;font-family:var(--nv-serif);font-style:italic;font-weight:500;font-size:18px;line-height:1.4;color:var(--nv-press-navy)">A 40% survival benefit in patients treated with the investigational therapy.</blockquote>
    <cite style="font-family:var(--nv-sans);font-style:normal;font-size:11px;color:var(--nv-sepia);display:block;margin-bottom:16px">Veridian Oncology, press release, May 19 2026</cite>
    <div style="display:flex;gap:28px;align-items:flex-end;padding-top:14px;border-top:1px solid var(--nv-rule)">
      <div><div style="font-family:var(--nv-mono);font-weight:500;font-size:24px;color:var(--nv-press-navy)">58<span style="font-size:13px;color:var(--nv-sepia)">/100</span></div><div style="font-family:var(--nv-sans);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--nv-sepia);margin-top:2px">Evidence quality</div></div>
      <div><div style="font-family:var(--nv-mono);font-weight:500;font-size:24px;color:var(--nv-press-navy)">41<span style="font-size:13px;color:var(--nv-sepia)">/100</span></div><div style="font-family:var(--nv-sans);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--nv-sepia);margin-top:2px">Source credibility</div></div>
      <div style="margin-left:auto;display:flex;gap:8px"><span class="tag">Secondary endpoint</span><span class="tag">Weak comparator</span></div>
    </div>
  </figure></div></body></html>
