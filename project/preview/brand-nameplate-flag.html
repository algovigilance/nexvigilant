<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Nameplate — tabloid flag</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Serial Vigilant · Press-Navy field option</div>
  <div style="background:var(--nv-press-navy);padding:26px 20px;text-align:center">
    <div style="font-family:var(--nv-sans);font-size:9px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:rgba(251,248,241,.65);margin-bottom:10px">NexVigilant · An imprint of The Vigilant Press</div>
    <div style="font-family:var(--nv-serif);font-weight:500;font-size:38px;line-height:1;letter-spacing:.01em;color:var(--nv-newsprint)">The Serial <em style="font-style:italic;color:#B91C1C">Vigilant</em></div>
    <div style="font-family:var(--nv-serif);font-style:italic;font-size:14px;color:var(--nv-gold);margin-top:10px">Tabloid vigilance for the credulous age</div>
  </div></div></body></html>
