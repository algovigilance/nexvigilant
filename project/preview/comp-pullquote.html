<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Editorial pull quote</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .badge{display:inline-flex;font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FBF8F1;padding:6px 11px;border-radius:1px;line-height:1}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Pull quote (a) — plain editorial form</div>
  <figure style="margin:0;text-align:center;max-width:560px;margin:0 auto">
    <div style="width:40px;height:2px;background:var(--nv-accent-red);margin:0 auto 16px"></div>
    <blockquote style="margin:0;font-family:var(--nv-serif);font-weight:500;font-style:italic;font-size:21px;line-height:1.3;color:var(--nv-press-navy)"><span style="color:var(--nv-accent-red)">&ldquo;</span>We don't see side effects. We see an underserved indication.<span style="color:var(--nv-accent-red)">&rdquo;</span></blockquote>
    <figcaption style="font-family:var(--nv-sans);font-size:11px;color:var(--nv-sepia);margin-top:14px">— Dale Pruitt, Chief Commercial Officer</figcaption>
  </figure></div></body></html>
