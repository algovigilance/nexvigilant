<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Rules & Tints</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;}
  .swatch{flex:1;min-width:0;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(28,24,18,.12);}
  .sw-meta{font-family:var(--nv-sans);font-size:11px;line-height:1.45;margin-top:8px;}
  .sw-name{font-weight:600;color:var(--nv-ink);letter-spacing:.02em;}
  .sw-hex{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;}
  .sw-role{color:var(--nv-sepia);}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);}
  
</style></head><body class="nv"><div class="card"><div class="lbl" style="margin-bottom:16px">Hairlines &amp; flat tints (never gradients)</div>
  <div class="row">
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#D8CDB6;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:var(--nv-ink);text-transform:uppercase">#D8CDB6</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Rule</div><div class="sw-role">Hairlines · column rule</div></div>
  </div>
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#E7DFCC;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:var(--nv-ink);text-transform:uppercase">#E7DFCC</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Rule Soft</div><div class="sw-role">Faintest divider</div></div>
  </div>
    <div style="flex:1;min-width:0">
    <div class="swatch" style="height:84px;background:#F4EEE0;display:flex;align-items:flex-end;padding:8px;">
      <span style="font-family:var(--nv-mono);font-size:10px;color:var(--nv-ink);text-transform:uppercase">#F4EEE0</span>
    </div>
    <div class="sw-meta"><div class="sw-name">Newsprint Deep</div><div class="sw-role">Sunk panels</div></div>
  </div>
  </div></div></body></html>
