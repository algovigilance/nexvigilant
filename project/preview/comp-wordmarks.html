<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Imprint wordmarks</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .badge{display:inline-flex;font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FBF8F1;padding:6px 11px;border-radius:1px;line-height:1}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Nameplate wordmarks — distinguishing noun in accent</div>
  <div style="display:flex;flex-direction:column;gap:14px;text-align:center">
    <div style="font-family:var(--nv-serif);font-weight:500;font-size:30px;color:var(--nv-press-navy);letter-spacing:.01em">The Serial <em style="font-style:italic;color:#B91C1C">Vigilant</em></div>
    <div style="font-family:var(--nv-serif);font-weight:500;font-size:30px;color:var(--nv-press-navy);letter-spacing:.01em">The Black <em style="font-style:italic;color:#1C1812">Box</em></div>
    <div style="font-family:var(--nv-serif);font-weight:500;font-size:30px;color:var(--nv-press-navy);letter-spacing:.01em">The <em style="font-style:italic;color:#1E3A5F">Signal</em></div>
  </div>
  <div class="meta" style="margin-top:16px;text-align:center">NexVigilant · an imprint of The Vigilant Press</div></div></body></html>
