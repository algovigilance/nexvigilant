<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Mode badges</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .badge{display:inline-flex;font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FBF8F1;padding:6px 11px;border-radius:1px;line-height:1}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Mode badge — self-labels the piece</div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="badge" style="background:#B91C1C">SATIRE</span>
    <span class="badge" style="background:#1C1812">CRITIQUE</span>
    <span class="badge" style="background:#1E3A5F">ANALYSIS</span>
    <span class="badge" style="background:transparent;color:var(--nv-sepia);box-shadow:inset 0 0 0 1px var(--nv-rule)">DRAFT</span>
  </div>
  <div class="meta" style="margin-top:16px">Satire badge non-negotiable, always visible · solid accent field, newsprint text</div></div></body></html>
