<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>Byline & hedcut</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--nv-newsprint);}
  .card{box-sizing:border-box;width:700px;padding:26px 30px;background:var(--nv-newsprint);color:var(--nv-ink);}
  .card *{box-sizing:border-box;}
  .lbl{font-family:var(--nv-sans);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--nv-sepia);margin-bottom:16px;}
  .meta{font-family:var(--nv-mono);font-size:10.5px;color:var(--nv-sepia);text-transform:uppercase;letter-spacing:.04em;}
  .badge{display:inline-flex;font-family:var(--nv-sans);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FBF8F1;padding:6px 11px;border-radius:1px;line-height:1}
  
</style></head><body class="nv"><div class="card"><div class="lbl">Byline block — author as entity</div>
  <div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--nv-rule);border-bottom:1px solid var(--nv-rule)">
    <img src="../assets/hedcut-2.png" width="56" height="56" style="width:56px;height:56px;border-radius:50%;background:var(--nv-newsprint-deep);box-shadow:inset 0 0 0 1px var(--nv-rule);object-fit:cover;object-position:top center"/>
    <div style="font-family:var(--nv-sans);font-size:12px;color:var(--nv-sepia);line-height:1.5">
      <span style="color:var(--nv-ink);font-weight:600">By Dr. Anil Kothari</span>, MD, MPH<br/>Senior Analyst, Clinical Evidence<br/><time>May 27, 2026</time>
    </div>
  </div>
  <div class="meta" style="margin-top:14px">Stipple hedcut + name + creds + role + ISO date · ruled top/bottom</div></div></body></html>
